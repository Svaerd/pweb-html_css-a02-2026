<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page">
        <nav class="nav">
            <div class="nav-pill">
                <a href="home.html" class="nav-item">Home</a>
                <a href="about.html" class="nav-item">About</a>
                <a href="work.html" class="nav-item">Work</a>
                <a href="contact.html" class="nav-item active">Contact</a>
            </div>
        </nav>

        <main class="content">
            <div class="contact-card">
                <h2 class="contact-title">Contact Me!</h2>
                <form onsubmit="return false;">
                    <label class="field-label" for="c-name">Name</label>
                    <input class="field" type="text" id="c-name" placeholder="Your name">

                    <label class="field-label" for="c-email">Email</label>
                    <input class="field" type="email" id="c-email" placeholder="you@example.com">

                    <label class="field-label" for="c-message">Message</label>
                    <textarea class="field" id="c-message" placeholder="Write your message..."></textarea>

                    <button type="submit" class="send-btn">Send</button>
                </form>
            </div>

            <div class="contact-direct">
                <p class="direct-label">(Or Contact Me Directly)</p>
                <p class="direct-email">abc@gmail.com</p>
            </div>
        </main>

        <footer class="footer">
            <span class="copyright">© 2026</span>
            <div class="socials">
                <a href="#" aria-label="Instagram">
                    <img src="icons/ig.svg" alt="Instagram">
                </a>
                <a href="#" aria-label="LinkedIn">
                    <img src="icons/linkedin.svg" alt="LinkedIn">
                </a>
                <a href="#" aria-label="GitHub">
                    <img src="icons/github.svg" alt="GitHub">
                </a>
            </div>
        </footer>
    </div>
</body>
</html>
