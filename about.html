<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page">
        <nav class="nav">
            <div class="nav-pill">
                <a href="home.html" class="nav-item">Home</a>
                <a href="about.html" class="nav-item active">About</a>
                <a href="work.html" class="nav-item">Work</a>
                <a href="contact.html" class="nav-item">Contact</a>
            </div>
        </nav>

        <main class="content">
            <section class="section">
                <h2 class="section-title">Education</h2>
                <div class="education-item">
                    <span class="dot"></span>
                        <div class="education-text">
                            <p class="edu-title">ITS</p>
                            <p class="edu-sub">Information Technology</p>
                        </div>
                    <span class="edu-date">2025 - Current</span>
                </div>
            </section>

            <section class="section">
                <h2 class="section-title">Skill</h2>

                <div class="skill-group">
                    <h3 class="skill-label">Languages</h3>
                    <div class="icon-row">
                        <div class="icon-badge"><img src="icons/languages/c.svg" alt="C"></div>
                        <div class="icon-badge"><img src="icons/languages/c++.svg" alt="C++"></div>
                        <div class="icon-badge"><img src="icons/languages/python.svg" alt="Python"></div>
                        <div class="icon-badge"><img src="icons/languages/js.svg" alt="JavaScript"></div>
                        <div class="icon-badge"><img src="icons/languages/ts.svg" alt="TypeScript"></div>
                        <div class="icon-badge"><img src="icons/languages/java.svg" alt="Java"></div>
                    </div>
                </div>

                <div class="skill-group">
                    <h3 class="skill-label">Web Technologies</h3>
                    <div class="icon-row">
                        <div class="icon-badge"><img src="icons/web_technologies/html.svg" alt="HTML5"></div>
                        <div class="icon-badge"><img src="icons/web_technologies/css.svg" alt="CSS3"></div>
                    </div>
                </div>

                <div class="skill-group">
                    <h3 class="skill-label">Frameworks</h3>
                    <div class="icon-row">
                        <div class="icon-badge"><img src="icons/frameworks/react.svg" alt="React"></div>
                        <div class="icon-badge"><img src="icons/frameworks/tailwind.svg" alt="Tailwind CSS"></div>
                    </div>
                </div>

                <div class="skill-group">
                    <h3 class="skill-label">Database & Backend</h3>
                    <div class="icon-row">
                        <div class="icon-badge"><img src="icons/db/mysql.svg" alt="MySQL"></div>
                        <div class="icon-badge"><img src="icons/db/mongodb.svg" alt="MongoDB"></div>
                        <div class="icon-badge"><img src="icons/db/nodejs.svg" alt="Node.js"></div>
                    </div>
                </div>

                <div class="skill-group">
                    <h3 class="skill-label">Tools</h3>
                    <div class="icon-row">
                        <div class="icon-badge"><img src="icons/tools/github.svg" alt="GitHub"></div>
                        <div class="icon-badge"><img src="icons/tools/git.svg" alt="Git"></div>
                        <div class="icon-badge"><img src="icons/tools/vscode.svg" alt="VS Code"></div>
                        <div class="icon-badge"><img src="icons/tools/figma.svg" alt="Figma"></div>
                        <div class="icon-badge"><img src="icons/tools/vite.svg" alt="Vite"></div>
                    </div>
                </div>
            </section>

            <section class="section">
                <h2 class="section-title">CV</h2>
                <a href="cv.pdf" class="cv-badge" aria-label="Download CV">
                    <div class="icon-badge"><img src="icons/file.svg" alt="CV"></div>
                </a>
            </section>
        </main>

        <footer class="footer">
            <span class="copyright">© 2026</span>
            <div class="socials">
                <a href="#" aria-label="Instagram">
                    <img src="icons/ig.svg" alt="Instagram">
                </a>
                <a href="#" aria-label="LinkedIn">
                    <img src="icons/linkedin.svg" alt="LinkedIn">
                </a>
                <a href="#" aria-label="GitHub">
                    <img src="icons/github.svg" alt="GitHub">
                </a>
            </div>
        </footer>
    </div>
</body>
</html>
